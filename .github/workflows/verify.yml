name: verify

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ignore_prev_result:
        description: Ignore cached verification results
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up competitive-verifier
        uses: competitive-verifier/actions/setup@v2
        with:
          cache-pip: true

      - name: Resolve verification files
        uses: competitive-verifier/actions/oj-resolve@v2
        with:
          output-path: verify_files.json

      - name: Parse documentation
        uses: competitive-verifier/actions/parse-doxygen@v2
        with:
          verify-files: verify_files.json

      - name: Upload verification metadata
        uses: competitive-verifier/actions/upload-verify-artifact@v2
        with:
          file: verify_files.json

      - name: Count bundled files
        id: bundled
        shell: bash
        run: echo "count=$(find .competitive-verifier/bundled -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload bundled files
        if: steps.bundled.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: Bundled-${{ runner.os }}
          path: .competitive-verifier/bundled
          retention-days: 1

  verify:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        index: ["00", "01", "02", "03"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore cached results
        if: ${{ !inputs.ignore_prev_result }}
        id: restore-results
        uses: actions/cache/restore@v4
        with:
          path: merged-result.json
          key: ${{ runner.os }}-verify-result-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-verify-result-

      - name: Download verification metadata
        uses: competitive-verifier/actions/download-verify-artifact@v2

      - name: Set up competitive-verifier
        uses: competitive-verifier/actions/setup@v2
        with:
          cache-pip: true

      - name: Verify
        uses: competitive-verifier/actions/verify@v2
        with:
          destination: ${{ runner.temp }}/result.json
          split-size: 4
          split-index: ${{ matrix.index }}
          timeout: 3600
          prev-result: ${{ steps.restore-results.outputs.cache-hit && 'merged-result.json' || '' }}

      - name: Upload verification result
        uses: actions/upload-artifact@v7
        with:
          name: Result-${{ runner.os }}-${{ matrix.index }}
          path: ${{ runner.temp }}/result.json
          retention-days: 1

  docs-and-check:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      upload-pages: ${{ steps.upload-pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verification artifacts
        id: artifacts
        uses: competitive-verifier/actions/download-verify-artifact@v2
        with:
          download-all: true
          artifact-root: .artifacts

      - name: Restore bundled files
        shell: bash
        run: |
          src=".artifacts/Bundled-${{ runner.os }}"
          if [[ -d "$src" ]]; then
            mkdir -p .competitive-verifier
            mv "$src" .competitive-verifier/bundled
          fi

      - name: Set up competitive-verifier
        uses: competitive-verifier/actions/setup@v2
        with:
          cache-pip: true

      - name: Merge verification results
        uses: competitive-verifier/actions/merge-result@v2
        with:
          result-files: ${{ steps.artifacts.outputs.artifacts-root }}/Result-*/result.json
          output-path: merged-result.json

      - name: Generate documentation
        uses: competitive-verifier/actions/docs@v2
        with:
          verify-result: merged-result.json
          destination: _jekyll
          write-summary: true

      - name: Save verification results
        uses: actions/cache/save@v4
        with:
          path: merged-result.json
          key: ${{ runner.os }}-verify-result-${{ github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        uses: actions/jekyll-build-pages@v1
        with:
          source: _jekyll
          destination: _site

      - name: Upload Pages artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Check verification results
        uses: competitive-verifier/actions/check@v2
        with:
          verify-result: ${{ steps.artifacts.outputs.artifacts-root }}/Result-*/result.json

  deploy:
    if: >-
      (success() || failure()) &&
      github.ref == 'refs/heads/main' &&
      needs.docs-and-check.outputs.upload-pages == 'true'
    runs-on: ubuntu-latest
    needs: docs-and-check
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
