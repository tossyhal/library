name: verify

on:
  push:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tools
        run: |
          pip install -U online-judge-tools verification-helper

      - name: Verify all
        run: |
          oj-verify all

      # timestamps 更新などで差分が出たら、自動コミットして押し戻す（単一ブランチ運用向け）
      - name: Commit verification results if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update verification results"
            git push
          fi
